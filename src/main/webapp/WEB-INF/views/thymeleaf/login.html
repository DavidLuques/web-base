<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - PetTracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">
  
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Encabezado con Ícono -->
    <div class="bg-[#2d3748] py-8 flex flex-col items-center">
        <div class="w-16 h-16 bg-indigo-500 rounded-2xl flex items-center justify-center mb-4 shadow-lg">
            <i data-lucide="paw-print" class="w-10 h-10 text-white"></i>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-wide titulo">PetTracker</h2>
        <p class="text-slate-300 text-sm mt-1">¡Bienvenido de nuevo!</p>
    </div>

    <!-- Formulario -->
    <div class="p-8">
      <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}" class="flex flex-col gap-5">
        
        <!-- Error -->
        <div th:if="${error != null}" class="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-lg flex items-start gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-rose-500 shrink-0 mt-0.5"></i>
            <p id="alerta-error" class="text-sm text-rose-700 font-medium" th:text="${error}"></p>
        </div>

        <!-- Input Email -->
        <div class="flex flex-col gap-1.5">
            <label for="email" class="text-sm font-semibold text-slate-700 ml-1">Correo Electrónico</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="mail" class="w-5 h-5 text-slate-400"></i>
                </div>
                <input th:field="*{email}" id="email" type="email" required placeholder="tu@email.com" 
                       class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-700 placeholder-slate-400 bg-slate-50 focus:bg-white shadow-sm" />
            </div>
        </div>

        <!-- Input Password -->
        <div class="flex flex-col gap-1.5">
            <label for="password" class="text-sm font-semibold text-slate-700 ml-1">Contraseña</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                </div>
                <input th:field="*{password}" type="password" id="password" required placeholder="••••••••" 
                       class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-700 placeholder-slate-400 bg-slate-50 focus:bg-white shadow-sm" />
            </div>
        </div>

        <!-- Botón Submit -->
        <button id="btn-login" type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-md hover:shadow-lg mt-2 flex justify-center items-center gap-2 transform active:scale-[0.98]">
            Iniciar Sesión
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

      <!-- Separador y Registro -->
      <div class="mt-8 pt-6 border-t border-slate-100 text-center flex flex-col gap-2">
        <p class="text-slate-500 text-sm">¿No tienes una cuenta?</p>
        <a id="btn-register" href="nuevo-usuario" class="text-indigo-600 hover:text-indigo-800 font-bold text-sm transition-colors hover:underline">
            Crear cuenta nueva
        </a>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
      lucide.createIcons();
  </script>
</body>
</html>
