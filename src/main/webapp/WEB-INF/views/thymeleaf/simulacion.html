<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Análisis de Actividad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

<div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'vista')"></div>

  <main class="flex-1 flex flex-col h-full overflow-y-auto">

    <header th:replace="fragmentos/header :: header(${mascotaNombre ?: 'Mascota'}, ${idMascota}, 'vista', 'An&aacute;lisis de Actividad')"></header>

    <!-- ESTADO -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 flex justify-between items-center">
      <div>
        <p class="text-sm text-gray-400 font-medium mb-1">Estado Actual</p>
        <h2 id="estado" class="text-3xl font-semibold text-gray-800">Cargando...</h2>
      </div>
      <div id="badge-actividad" class="bg-blue-100 text-blue-600 px-4 py-2 rounded-full font-medium text-sm flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
        <span>Nivel liviano de actividad</span>
      </div>
    </div>

<!-- RESUMEN -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
  <div class="mb-4 flex items-center justify-between">
    <h3 class="text-lg font-bold text-slate-800">Resumen</h3>
    <select id="selector-rango" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
      <option value="3">Últimos 3 minutos</option>
      <option value="5">Últimos 5 minutos</option>
      <option value="10">Últimos 10 minutos</option>
      <option value="15">Últimos 15 minutos</option>
      <option value="30">Últimos 30 minutos</option>
      <option value="45">Últimos 45 minutos</option>
      <option value="60">Última hora</option>
      <option value="0">Todo el historial</option>
    </select>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">

    <div class="flex flex-col items-center">
      <div id="chart-distancia"></div>
      <p class="text-sm font-medium text-gray-700 mt-2">Distancia Recorrida</p>
      <button onclick="abrirModalSim('distancia')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
    </div>

    <div class="flex flex-col items-center">
      <div id="chart-calorias"></div>
      <p class="text-sm font-medium text-gray-700 mt-2">Calorías Quemadas</p>
      <button onclick="abrirModalSim('calorias')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
    </div>

    <div class="flex flex-col items-center">
      <div id="chart-sueno"></div>
      <p class="text-sm font-medium text-gray-700 mt-2">Tiempo de Sueño</p>
      <button onclick="abrirModalSim('sueno')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
    </div>

    <div class="flex flex-col items-center">
      <div id="chart-pasos"></div>
      <p class="text-sm font-medium text-gray-700 mt-2">Pasos Hoy</p>
      <button onclick="abrirModalSim('pasos')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
    </div>

  </div>
</div>

    <!-- HISTORIAL DISTANCIA -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Distancia Recorrida - Hoy</h3>
      <div id="chart-historial-distancia"></div>
    </div>

    <!-- HISTORIAL CALORIAS -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Calorías Quemadas - Hoy</h3>
      <div id="chart-historial-calorias"></div>
    </div>

    <!-- HISTORIAL SUEÑO -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Tiempo de Sueño - Hoy</h3>
      <div id="chart-historial-sueno"></div>
    </div>

    <!-- HISTORIAL PASOS -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Pasos - Hoy</h3>
      <div id="chart-historial-pasos"></div>
    </div>

    <!-- NIVELES DE ACTIVIDAD -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Niveles de Actividad</h3>
      <div id="chart-niveles-actividad"></div>
    </div>

  </main>

<!-- MODAL -->
<div id="modal-sim-vermas" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6 flex flex-col gap-4">
    <div class="flex items-center justify-between">
      <h2 id="modal-sim-titulo" class="text-slate-800 font-bold text-lg"></h2>
      <button onclick="cerrarModalSim()" class="text-slate-400 hover:text-slate-600 text-xl font-bold leading-none">&times;</button>
    </div>
    <div id="modal-sim-contenido" class="flex flex-col gap-3 text-sm text-slate-600"></div>
  </div>
</div>

  <script th:inline="javascript">
    var idMascota = [[${idMascota}]];
    lucide.createIcons();
  </script>

  <script th:src="@{/js/simulacion.js}"></script>

</body>
</html>
