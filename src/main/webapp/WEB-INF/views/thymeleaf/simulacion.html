<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Análisis de Actividad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

<div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'vista')"></div>

  <main class="flex-1 flex flex-col h-full overflow-y-auto">

    <header th:replace="fragmentos/header :: header(${mascotaNombre ?: 'Mascota'}, ${idMascota}, 'vista', 'Análisis de Actividad')"></header>

    <!-- ESTADO -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 flex justify-between items-center">
      <div>
        <p class="text-sm text-gray-400 font-medium mb-1">Estado Actual</p>
        <h2 id="estado" class="text-3xl font-semibold text-gray-800">Cargando...</h2>
      </div>
      <div id="badge-actividad" class="bg-blue-100 text-blue-600 px-4 py-2 rounded-full font-medium text-sm flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
        <span>Nivel liviano de actividad</span>
      </div>
    </div>

    <!-- RESUMEN -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h3 class="text-lg font-bold mb-6">Resumen</h3>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
        <div class="flex flex-col items-center">
          <div id="chart-distancia"></div>
          <p class="text-sm font-medium text-gray-700 mt-2">Distancia Recorrida</p>
        </div>

        <div class="flex flex-col items-center">
          <div id="chart-calorias"></div>
          <p class="text-sm font-medium text-gray-700 mt-2">Calorías Quemadas</p>
        </div>

        <div class="flex flex-col items-center">
          <div id="chart-sueno"></div>
          <p class="text-sm font-medium text-gray-700 mt-2">Tiempo de Sueño</p>
        </div>

        <div class="flex flex-col items-center">
          <div id="chart-pasos"></div>
          <p class="text-sm font-medium text-gray-700 mt-2">Pasos Hoy</p>
        </div>
      </div>
    </div>

    <!-- HISTORIAL DISTANCIA -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Distancia Recorrida - Hoy</h3>
      <div id="chart-historial-distancia"></div>
    </div>

    <!-- HISTORIAL CALORIAS -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Calorías Quemadas - Hoy</h3>
      <div id="chart-historial-calorias"></div>
    </div>

    <!-- HISTORIAL SUEÑO -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Tiempo de Sueño - Hoy</h3>
      <div id="chart-historial-sueno"></div>
    </div>

    <!-- HISTORIAL PASOS -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Pasos - Hoy</h3>
      <div id="chart-historial-pasos"></div>
    </div>

    <!-- NIVELES DE ACTIVIDAD -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6">
      <h3 class="text-lg font-bold mb-4 text-slate-800">Niveles de Actividad</h3>
      <div id="chart-niveles-actividad"></div>
    </div>

  </main>

  <script th:inline="javascript">
    const idMascota = [[${idMascota}]];
    lucide.createIcons();
  </script>

  <script th:src="@{/js/simulacion.js}"></script>

</body>
</html>
