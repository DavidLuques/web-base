<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Centro de Alertas - PetTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

<div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'alertas')"></div>

<main class="flex-1 flex flex-col h-full overflow-hidden">

    <header th:replace="fragmentos/header :: header(${mascotaNombre ?: 'Mascota'}, ${idMascota}, 'alertas', 'Historial de Alertas')"></header>

    <div class="flex-1 p-4 sm:p-8 overflow-y-auto">
        <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">

            <!-- Alertas de signos vitales -->
            <section class="flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Signos vitales</h2>
                        <p class="text-sm text-slate-500">Alertas generadas por los sensores en tiempo real.</p>
                    </div>
                    <span th:if="${idMascota != null}" id="contador-alertas"
                          class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full text-xs font-bold">
                        0 Alertas
                    </span>
                </div>

                <!-- Sin mascota registrada -->
                <div th:if="${idMascota == null}"
                     class="bg-white border border-slate-200 rounded-2xl p-12 text-center shadow-sm">
                    <i data-lucide="paw-print" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                    <p class="text-sm text-slate-500">No ten&eacute;s ninguna mascota registrada. &iexcl;Registr&aacute; la primera para empezar!</p>
                </div>

                <!-- Con mascota: lista dinámica -->
                <div th:if="${idMascota != null}" id="lista-alertas-exclusiva" class="flex flex-col gap-4">
                    <div class="text-center py-12 text-slate-400">
                        <div class="animate-spin inline-block w-6 h-6 border-[3px] border-current border-t-transparent text-indigo-600 rounded-full mb-2"
                             role="status" aria-label="loading"></div>
                        <p class="text-sm">Buscando alertas en el servidor...</p>
                    </div>
                </div>
            </section>

            <!-- Alertas de amigos y transferencias -->
            <section class="flex flex-col gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Notificaciones</h2>
                    <p class="text-sm text-slate-500">Solicitudes de amistad, transferencias y actividad social.</p>
                </div>
                <div id="lista-alertas-usuario" class="flex flex-col gap-4">
                    <div class="text-center py-12 text-slate-400">
                        <div class="animate-spin inline-block w-6 h-6 border-[3px] border-current border-t-transparent text-indigo-600 rounded-full mb-2"
                             role="status" aria-label="loading"></div>
                        <p class="text-sm">Buscando notificaciones...</p>
                    </div>
                </div>
            </section>

        </div>
    </div>
</main>

<script th:src="@{/js/alertas.js}"></script>

<script th:inline="javascript">
    const idMascota = [[${idMascota}]];
    inicializarAlertas(idMascota);
</script>
</body>
</html>
