<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Vallado Imaginario</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" th:href="@{/css/valla.css}" />
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

  <div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'valla')"></div>

  <main class="flex-1 flex flex-col h-full overflow-y-auto">

    <div th:replace="fragmentos/header :: header(${mascotaNombre}, ${idMascota})"></div>

    <div class="p-6">
      
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-400 font-medium mb-1">Estado del Perímetro</p>
          <h2 id="estado-texto" class="text-2xl font-semibold text-gray-800">Buscando señal GPS...</h2>
        </div>
        
        <div id="badge-alerta" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-full font-medium text-sm flex items-center gap-2 border-2 border-transparent transition-all duration-300">
          <div id="indicador-luz" class="w-3 h-3 rounded-full bg-gray-400 animate-pulse"></div>
          <span id="distancia-texto">Calculando...</span>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 flex justify-center overflow-x-auto">
        <div class="plano-cartesiano">
          <div id="zona-permitida" class="zona-permitida"></div>
          <div class="punto-casa" title="Hogar"></div>
          <div id="punto-mascota" class="punto-mascota" title="Mascota"></div>
        </div>
      </div>

    </div>

  </main>

  <script th:inline="javascript">
    // Inicialización de iconos Lucide
    lucide.createIcons();

    // Lógica del Vallado Geográfico
    const idMascota = [[${idMascota}]];
    const latHogar = -34.7222;
    const lonHogar = -58.5250;
    const radioValla = 150; // Metros
    
    // Elementos del DOM
    const puntoMascota = document.getElementById('punto-mascota');
    const zonaPermitida = document.getElementById('zona-permitida');
    const badgeAlerta = document.getElementById('badge-alerta');
    const indicadorLuz = document.getElementById('indicador-luz');
    const estadoTexto = document.getElementById('estado-texto');
    const distanciaTexto = document.getElementById('distancia-texto');

    // Cálculo matemático con fórmula de Haversine
    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radio de la Tierra en metros
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    async function actualizarPosicion() {
      try {
        const response = await fetch(`/spring/api/mascotas/${idMascota}/ubicacion`);
        const datos = await response.json();
        
        const nuevaLat = datos.latitud;
        const nuevaLon = datos.longitud;

        // GPS a Metros (1 pixel = 1 metro)
        const metrosY = -(nuevaLat - latHogar) * 111320;
        const metrosX = (nuevaLon - lonHogar) * (111320 * Math.cos(latHogar * Math.PI / 180));

        // Mover el punto en el CSS
        puntoMascota.style.left = `calc(50% + ${metrosX}px)`;
        puntoMascota.style.top = `calc(50% + ${metrosY}px)`;

        // Evaluar distancia
        const distanciaReal = Math.round(calcularDistancia(latHogar, lonHogar, nuevaLat, nuevaLon));
        distanciaTexto.innerText = `${distanciaReal} metros del hogar`;
        
        if (distanciaReal > radioValla) {
          // ESTADO PELIGRO (Clases de Tailwind)
          estadoTexto.innerText = "¡Mascota fuera de la zona segura!";
          estadoTexto.className = "text-2xl font-semibold text-red-600";
          
          badgeAlerta.className = "bg-red-50 text-red-700 px-4 py-2 rounded-full font-bold text-sm flex items-center gap-2 border-2 border-red-200";
          indicadorLuz.className = "w-3 h-3 rounded-full bg-red-600 animate-pulse";
          
          // Modificar CSS en línea del mapa
          zonaPermitida.style.borderColor = '#ef4444'; // red-500
          zonaPermitida.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
          puntoMascota.style.backgroundColor = '#ef4444'; 
        } else {
          // ESTADO SEGURO (Clases de Tailwind)
          estadoTexto.innerText = "Dentro del perímetro establecido";
          estadoTexto.className = "text-2xl font-semibold text-green-700";
          
          badgeAlerta.className = "bg-green-50 text-green-700 px-4 py-2 rounded-full font-bold text-sm flex items-center gap-2 border-2 border-green-200";
          indicadorLuz.className = "w-3 h-3 rounded-full bg-green-500";
          
          // Modificar CSS en línea del mapa
          zonaPermitida.style.borderColor = '#3b82f6'; // blue-500
          zonaPermitida.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
          puntoMascota.style.backgroundColor = '#22c55e'; // green-500
        }

      } catch (error) {
        console.error("Error conectando con la API:", error);
      }
    }

    // Ejecutar cada 3 segundos
    setInterval(actualizarPosicion, 3000);
    actualizarPosicion();
  </script>

</body>
</html>
