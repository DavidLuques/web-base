<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Vallado Imaginario</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" th:href="@{/css/valla.css}" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

  <div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'valla')"></div>

  <main class="flex-1 flex flex-col h-full overflow-y-auto">

    <div th:replace="fragmentos/header :: header(
	    ${mascotaNombre},
	    ${idMascota},
	    'valla',
	    'Vallado Imaginario'
	)"></div>

    <div class="p-6">

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-400 font-medium mb-1">Estado del Perímetro</p>
          <h2 id="estado-texto" class="text-2xl font-semibold text-gray-800">Buscando señal GPS...</h2>
        </div>

        <div id="badge-alerta"
          class="bg-gray-100 text-gray-600 px-4 py-2 rounded-full font-medium text-sm flex items-center gap-2 border-2 border-transparent transition-all duration-300">
          <div id="indicador-luz" class="w-3 h-3 rounded-full bg-gray-400 animate-pulse"></div>
          <span id="distancia-texto">Calculando...</span>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-6 flex flex-col sm:flex-row items-center justify-between gap-6 barra-controles-vallado">        
        <div class="flex items-center gap-4">
          <label for="input-radio" class="font-medium text-slate-700">Radio (metros):</label>
          <input type="number" id="input-radio" value="150" min="10" max="2000" step="10"
            class="border border-gray-300 rounded-lg px-4 py-2 w-28 text-center font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
          <button id="btn-confirmar-radio"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1 px-3 rounded-lg text-sm transition-all duration-200">
            Confirmar
          </button>
        </div>

        <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-lg border border-slate-200">
          <span class="font-semibold text-slate-700">Activar Vallado</span>
          <label for="toggle-vallado" class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggle-vallado" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-300 rounded-full peer-checked:bg-blue-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full peer-checked:after:border-white"></div>
          </label>
        </div>

        <div class="flex items-center gap-3">
          <label class="font-semibold text-slate-700">Dirección del centro:</label>
          <div class="relative w-80">
            <div class="flex gap-2">
              <input type="text" id="input-direccion-valla" placeholder="Ej: Obelisco, Buenos Aires" 
                    class="border border-slate-300 px-3 py-1.5 rounded-lg w-full focus:outline-none focus:border-blue-500" />
              <button id="btn-buscar-direccion" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-1.5 px-4 rounded-lg">
                Buscar
              </button>
            </div>
            
              <ul id="lista-resultados" class="absolute left-0 top-full w-full bg-white border border-gray-200 shadow-lg rounded-lg mt-1 hidden max-h-60 overflow-y-auto lista-sugerencias-valla">
              </ul>
          </div>
        </div>

      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 flex justify-center overflow-x-auto contenedor-mapa-valla">
        <div class="w-full h-[450px] rounded-xl shadow-inner border border-slate-200" id="mapa-valla"></div>
      </div>
    </div>

  </main>

  <script th:src="@{/js/valla.js}"></script>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
      const idMascota = [[${ idMascota }]];
      inicializarValla(idMascota);
    });
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>

</html>
