<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(idMascota, paginaActiva)" class="w-20 bg-[#2d3748] flex flex-col items-center py-6 border-r border-slate-700 shadow-xl z-20">
  <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center mb-8">
    <i data-lucide="paw-print" class="w-6 h-6 text-white"></i>
  </div>
  <nav class="flex flex-col gap-6 w-full">
    <th:block th:if="${idMascota != null}">
      <a th:href="@{/analisis/dashboard/{id}(id=${idMascota})}"
         th:class="${paginaActiva == 'dashboard'} ? 'w-full flex justify-center py-3 bg-white/10 border-l-4 border-indigo-400' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'">
        <i th:class="${paginaActiva == 'dashboard'} ? 'w-6 h-6 text-white' : 'w-6 h-6'" data-lucide="home"></i>
      </a>
      <a th:href="@{/analisis/vista/{id}(id=${idMascota})}"
         th:class="${paginaActiva == 'vista'} ? 'w-full flex justify-center py-3 bg-white/10 border-l-4 border-indigo-400' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'">
        <i th:class="${paginaActiva == 'vista'} ? 'w-6 h-6 text-white' : 'w-6 h-6'" data-lucide="activity"></i>
      </a>
      <a th:href="@{/analisis/alertas/{id}(id=${idMascota})}"
         th:class="${paginaActiva == 'alertas'} ? 'w-full flex justify-center py-3 bg-white/10 border-l-4 border-indigo-400' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'">
        <i th:class="${paginaActiva == 'alertas'} ? 'w-6 h-6 text-white' : 'w-6 h-6'" data-lucide="bell"></i>
      </a>
      <a th:href="@{/analisis/valla/{id}(id=${idMascota})}"
         th:class="${paginaActiva == 'valla'} ? 'w-full flex justify-center py-3 bg-white/10 border-l-4 border-indigo-400' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'">
        <i th:class="${paginaActiva == 'valla'} ? 'w-6 h-6 text-white' : 'w-6 h-6'" data-lucide="map-pin"></i>
      </a>
      <a th:href="@{/amigos(idMascota=${idMascota})}"
         th:class="${paginaActiva == 'amigos'} ? 'w-full flex justify-center py-3 bg-white/10 border-l-4 border-indigo-400' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'">
        <i th:class="${paginaActiva == 'amigos'} ? 'w-6 h-6 text-white' : 'w-6 h-6'" data-lucide="users"></i>
      </a>
      <a th:href="@{/transferencias(idMascota=${idMascota})}"
         th:class="${paginaActiva == 'transferencias'} ? 'w-full flex justify-center py-3 bg-white/10 border-l-4 border-indigo-400' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'">
        <i th:class="${paginaActiva == 'transferencias'} ? 'w-6 h-6 text-white' : 'w-6 h-6'" data-lucide="repeat"></i>
      </a>
    </th:block>
    <th:block th:if="${idMascota == null}">
      <span class="w-full flex justify-center py-3 text-slate-600 cursor-not-allowed opacity-40">
        <i data-lucide="home" class="w-6 h-6"></i>
      </span>
      <span class="w-full flex justify-center py-3 text-slate-600 cursor-not-allowed opacity-40">
        <i data-lucide="activity" class="w-6 h-6"></i>
      </span>
      <span class="w-full flex justify-center py-3 text-slate-600 cursor-not-allowed opacity-40">
        <i data-lucide="bell" class="w-6 h-6"></i>
      </span>
      <span class="w-full flex justify-center py-3 text-slate-600 cursor-not-allowed opacity-40">
        <i data-lucide="map-pin" class="w-6 h-6"></i>
      </span>
      <span class="w-full flex justify-center py-3 text-slate-600 cursor-not-allowed opacity-40">
        <i data-lucide="users" class="w-6 h-6"></i>
      </span>
      <span class="w-full flex justify-center py-3 text-slate-600 cursor-not-allowed opacity-40">
        <i data-lucide="repeat" class="w-6 h-6"></i>
      </span>
    </th:block>
  </nav>
  <div class="mt-auto w-full flex flex-col gap-2">
    <a th:href="@{/configuraciones(idMascota=${idMascota})}"
       th:class="${paginaActiva == 'configuraciones'} ? 'w-full flex justify-center py-3 text-white border-l-4 border-indigo-400 bg-white/10 transition-colors' : 'w-full flex justify-center py-3 text-slate-400 hover:text-white transition-colors'"
       title="Ajustes">
      <i data-lucide="settings" class="w-6 h-6"></i>
    </a>
    <a th:href="@{/logout}" class="w-full flex justify-center py-3 text-rose-400 hover:text-rose-500 transition-colors" title="Cerrar Sesión">
      <i data-lucide="log-out" class="w-6 h-6"></i>
    </a>
  </div>
</aside>
</body>
</html>
