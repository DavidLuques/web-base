<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(mascotaNombre, idMascota, vistaActual, titulo)" class="bg-white h-20 px-8 flex items-center justify-between border-b border-slate-200 shrink-0">
  <th:block th:with="mascotaAct=${idMascota != null ? @servicioMascotaImpl.obtenerMascotaPorId(idMascota) : null}">
  <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
    <span th:text="${titulo}">Título</span> - 
    <span id="nombre-mascota" th:text="${mascotaNombre != null and mascotaNombre != 'Mascota' ? mascotaNombre : (mascotaAct != null ? mascotaAct.nombre : 'Mascota')}">Mascota</span>
  </h1>
  <div class="flex gap-4">
    <!-- Pet Switcher Dropdown -->
    <div class="relative group cursor-pointer z-50">
      <div class="flex items-center gap-3 bg-amber-50 px-4 py-2 rounded-full border border-amber-100 transition-colors group-hover:bg-amber-100">
        <div class="w-8 h-8 rounded-full bg-amber-200 flex items-center justify-center text-amber-700">
          <i data-lucide="dog" class="w-4 h-4"></i>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold text-slate-800 leading-tight" th:text="${mascotaNombre != null and mascotaNombre != 'Mascota' ? mascotaNombre : (mascotaAct != null ? mascotaAct.nombre : 'Mascota')}">Mascota</span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500"></i>
        </div>
      </div>
      
      <!-- Dropdown Menu -->
      <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 overflow-hidden z-50">
        <div class="py-1">
          <!-- Iterar sobre las mascotas del usuario -->
          <a th:each="mascota : ${misMascotas}" 
             th:href="@{${vistaActual == 'configuraciones' || vistaActual == 'perfil' || vistaActual == 'nueva-mascota' ? '/' + vistaActual + '?idMascota=' + mascota.id : '/analisis/' + vistaActual + '/' + mascota.id}}"
             class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 transition-colors"
             th:classappend="${mascota.id == idMascota} ? 'bg-amber-50/50' : ''">
            <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"
                 th:classappend="${mascota.id == idMascota} ? 'bg-amber-100 text-amber-600' : ''">
              <i data-lucide="dog" class="w-3 h-3"></i>
            </div>
            <span class="text-sm font-medium text-slate-700" th:text="${mascota.nombre}">Nombre</span>
          </a>
        </div>
      </div>
    </div>
  </div>
  </th:block>
</header>
</body>
</html>
