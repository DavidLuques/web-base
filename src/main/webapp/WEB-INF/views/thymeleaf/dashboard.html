<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Salud - PetTracker</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

<div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'dashboard')"></div>

<main class="flex-1 flex flex-col h-full overflow-hidden">

  <header th:replace="fragmentos/header :: header(${mascotaNombre ?: 'Mascota'}, ${idMascota}, 'dashboard', 'Dashboard de Salud')"></header>

  <div class="flex-1 p-4 sm:p-8 overflow-y-auto">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">

      <div class="lg:col-span-2 flex flex-col gap-8">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6">
            <h3 class="text-slate-800 font-bold">Resumen</h3>
            <a th:href="@{/mascota/exportar/pdf(idMascota=${idMascota})}"
               class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">
              <i data-lucide="file-down" class="w-4 h-4"></i>
              Exportar PDF
            </a>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

            <div class="flex flex-col items-center">
              <div id="chart-frecuencia" class="-my-4"></div>
              <p class="text-sm font-semibold text-slate-700">Frecuencia Card&iacute;aca</p>
              <button onclick="abrirModal('frecuencia')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
            </div>

            <div class="flex flex-col items-center">
              <div id="chart-temperatura" class="-my-4"></div>
              <p class="text-sm font-semibold text-slate-700">Temperatura</p>
              <button onclick="abrirModal('temperatura')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
            </div>

            <div class="flex flex-col items-center">
              <div id="chart-presion" class="-my-4"></div>
              <p class="text-sm font-semibold text-slate-700">Presi&oacute;n Arterial</p>
              <button onclick="abrirModal('presion')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
            </div>

            <div class="flex flex-col items-center">
              <div id="chart-pasos" class="-my-4"></div>
              <p class="text-sm font-semibold text-slate-700">Pasos Diarios</p>
              <button onclick="abrirModal('pasos')" class="text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">Ver m&aacute;s</button>
            </div>

          </div>
        </div>

        <div class="flex flex-col gap-6">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-slate-800 font-bold mb-4">Frecuencia Card&iacute;aca - Hoy</h3>
            <div id="chart-historial-frecuencia" class="w-full h-48"></div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-slate-800 font-bold mb-4">Temperatura - Hoy</h3>
            <div id="chart-historial-temperatura" class="w-full h-48"></div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-slate-800 font-bold mb-4">Presi&oacute;n Arterial (Sist&oacute;lica) - Hoy</h3>
            <div id="chart-historial-presion" class="w-full h-48"></div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-slate-800 font-bold mb-4">Evoluci&oacute;n de Pasos - Hoy</h3>
            <div id="chart-historial-pasos" class="w-full h-48"></div>
          </div>
        </div>

      </div>

      <div class="lg:col-span-1 flex flex-col h-full">
        <h3 class="text-slate-800 font-bold mb-4">Alertas Recientes (Ultimas 3)</h3>
        <div class="flex flex-col gap-4 overflow-y-auto scrollbar-hide pr-2" id="contenedor-alertas">
          <div class="text-center py-6 text-slate-400">
            <div class="animate-spin inline-block w-5 h-5 border-[3px] border-current border-t-transparent text-indigo-600 rounded-full mb-2"></div>
            <p class="text-xs">Cargando alertas...</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</main>

<!-- MODAL -->
<div id="modal-vermas" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6 flex flex-col gap-4">
    <div class="flex items-center justify-between">
      <h2 id="modal-titulo" class="text-slate-800 font-bold text-lg"></h2>
      <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold leading-none">&times;</button>
    </div>
    <div id="modal-contenido" class="flex flex-col gap-3 text-sm text-slate-600"></div>
  </div>
</div>

<!-- Solo esta línea toca Thymeleaf -->
<script th:inline="javascript">
  var idMascota = [[${idMascota}]];
</script>

<!-- Todo el JS en archivo externo, Thymeleaf no lo procesa -->
  <script th:src="@{/js/dashboard.js}"></script>

</body>
</html>
