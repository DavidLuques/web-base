<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Mascota</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

<div th:replace="fragmentos/sidebar :: sidebar(${idMascota}, 'configuraciones')"></div>

<main class="flex-1 flex flex-col h-full overflow-hidden">
  <header th:replace="fragmentos/header :: header(${mascotaNombre ?: 'Mascota'}, ${idMascota}, 'configuraciones', 'Editar Mascota')"></header>
  <div class="flex-1 p-4 sm:p-8 overflow-y-auto">
    <div class="max-w-2xl mx-auto mt-8">
      
      <!-- Breadcrumb and Title -->
      <div class="mb-8 flex items-center gap-4">
        <a th:href="@{/configuraciones/mascota/perfil(idMascota=${idMascota})}" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 shadow-sm border border-slate-200 transition-all">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Editar Mascota</h1>
          <p class="text-slate-500">Actualiza la información de tu mascota</p>
        </div>
      </div>

      <!-- Error Alert -->
      <div th:if="${error}" class="mb-6 bg-rose-50 border border-rose-200 text-rose-700 px-6 py-4 rounded-2xl flex items-center gap-3">
        <div class="w-8 h-8 bg-rose-100 rounded-full flex items-center justify-center shrink-0">
          <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600"></i>
        </div>
        <p class="font-medium" th:text="${error}">Error al actualizar</p>
      </div>

      <!-- Form Card -->
      <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/40 p-8 border border-slate-100">
        <form th:action="@{/configuraciones/mascota/actualizar(idMascota=${idMascota})}" th:object="${datosMascota}" method="POST" class="space-y-6">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="user" class="w-4 h-4 text-slate-400"></i> Nombre
              </label>
              <input type="text" th:field="*{nombre}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" placeholder="Ej: Firulais" required>
            </div>
            
            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="tag" class="w-4 h-4 text-slate-400"></i> Tipo
              </label>
              <select th:field="*{tipo}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
                <option value="Otro">Otro</option>
              </select>
            </div>

            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4 text-slate-400"></i> Raza
              </label>
              <input type="text" th:field="*{raza}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" placeholder="Ej: Labrador">
            </div>

            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="users" class="w-4 h-4 text-slate-400"></i> Género
              </label>
              <select th:field="*{genero}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                <option value="Macho">Macho</option>
                <option value="Hembra">Hembra</option>
              </select>
            </div>

            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4 text-slate-400"></i> Peso (kg)
              </label>
              <input type="number" step="0.1" th:field="*{peso}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" placeholder="Ej: 15.5">
            </div>

            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> Fecha de Nacimiento
              </label>
              <input type="date" th:field="*{fechaNacimiento}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            </div>

            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <i data-lucide="maximize" class="w-4 h-4 text-slate-400"></i> Tamaño
              </label>
              <select th:field="*{tamano}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                <option value="PEQUENO">Pequeño</option>
                <option value="MEDIANO">Mediano</option>
                <option value="GRANDE">Grande</option>
              </select>
            </div>
          </div>

          <div class="pt-6 flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-xl transition-colors shadow-lg shadow-indigo-200 flex items-center gap-2">
              <i data-lucide="save" class="w-5 h-5"></i>
              Guardar Cambios
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</main>

<script>
  lucide.createIcons();
</script>
</body>
</html>
